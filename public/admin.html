lter(active).sort((x,y)=>(date(x)+x.agendamento?.time).localeCompare(date(y)+y.agendamento?.time)));if(tab==='Clube')h+='<p>Pedidos identificados como clube. Não representa confirmação de assinatura recorrente.</p>'+table(a.filter(o=>o.tipo==='clube'));if(tab==='Produção'){let m={};let dt=productionDate||today();h+=`<label>Data de entrega <input type=date id=prodDate value="${esc(dt)}"></label>`;orders.filter(o=>active(o)&&date(o)===dt).forEach(o=>items(o).forEach(i=>m[i.description]=(m[i.description]||0)+i.quantity));h+='<p>Quantidades de pedidos pagos ainda não concluídos (conforme filtro).</p><div class="cards">'+Object.entries(m).map(([k,v])=>card(esc(k),v)).join('')+'</div>'}if(tab==='Financeiro')h+=`<div class="cards">${card('Hoje',money(sum(all.filter(o=>day(o.pago_em||o.criado_em)===t))))}${card('Últimos 7 dias',money(sum(all.filter(o=>day(o.pago_em||o.criado_em)>=week))))}${card('Este mês',money(sum(all.filter(o=>day(o.pago_em||o.criado_em).slice(0,7)===t.slice(0,7)))))}</div><p>Receita bruta confirmada, incluindo frete e embalagem; não representa lucro líquido.</p>${table(p)}`;$('content').innerHTML=h;$('detail').hidden=true;if($('prodDate'))$('prodDate').onchange=e=>{productionDate=e.target.value;render()};}function detail(id){let o=orders.find(x=>x.order_nsu===id);if(!o)return;let c=o.cliente||{};$('detail').hidden=false;$('detail').innerHTML=`<h2>Detalhes do pedido</h2>${esc(id)}

<select id="stage">${states.map(s=>`<option ${s===stage(o)?'selected':''}>${s}</option>`).join('')}</select> <button id="save">Salvar status</button>`;$('save').onclick=async()=>{try{if(!demo)await api({action:'update',id,status:$('stage').value});o.operacional=$('stage').value;await load()}catch(e){$('notice').textContent=e.message}}}document.addEventListener('click',e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;render()}if(e.target.dataset.id)detail(e.target.dataset.id)});$('enter').onclick=async()=>{if(!$('password').value.trim()){$('notice').textContent='Informe a senha administrativa.';return;}demo=false;pass=$('password').value;$('notice').textContent='Verificando acesso...';$('enter').disabled=true;try{await load();if($('login').hidden)$('password').value='';}catch(e){$('notice').textContent=e.message||'Falha ao entrar';}finally{$('enter').disabled=false;}};$('password').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('enter').click();}});$('demo').onclick=()=>{demo=true;orders=sample();load()};$('reload').onclick=load;$('search').oninput=render;$('period').onchange=render;$('logout').onclick=()=>location.reload();

$('content').innerHTML=h+'<button id="saveConfig">Salvar configurações</button>';const root=$('content');root.oninput=e=>{let t=e.target,f=t.dataset.field;if(f){let p=config.products[Number(t.closest('[data-product]').dataset.product)];p[f]=f==='p'?Math.round(Number(t.value)*100):f==='active'?t.checked:t.value;}if(t.dataset.rate!==undefined)config.rates[Number(t.dataset.rate)]=Math.round(Number(t.value)*100);if(t.id==='cap')config.capacity=Number(t.value);if(t.id==='daily')config.daily=Number(t.value);};root.onchange=e=>{let t=e.target;if(t.dataset.photo===undefined||!t.files[0])return;let f=t.files[0];if(f.size>220000||!['image/png','image/jpeg','image/webp'].includes(f.type)){alert('Foto inválida ou maior que 220 KB');return;}let r=new FileReader();r.onload=()=>{config.products[Number(t.dataset.photo)].img=r.result;manage()};r.readAsDataURL(f);};root.onclick=e=>{let t=e.target;if(t.id==='addProduct'){config.products.push({id:config.products.length,n:'Novo sabor',p:1400,d:'',tag:'Clássicos',active:false,img:''});manage();}if(t.dataset.remove!==undefined){config.products[Number(t.dataset.remove)].img='';manage();}if(t.id==='addBlock'&&$('block').value){config.blocked=[...new Set([...config.blocked,$('block').value])];manage();}if(t.dataset.unblock) {config.blocked=config.blocked.filter(d=>d!==t.dataset.unblock);manage();}};$('saveConfig').onclick=async()=>{try{if(!demo)config=(await api({action:'settings-save',settings:config})).settings;$('notice').textContent=demo?'Prévia: alterações somente nesta sessão.':'Configurações salvas.';}catch(e){$('notice').textContent=e.message;}};

async function showClub(){const el=$('content');$('detail').hidden=true;el.oninput=null;el.onchange=null;el.onclick=null;el.textContent='Carregando Clube...';if(demo){el.textContent='Clube — disponível após login real.';return;}try{const {members}=await clubApi({action:'club-list'});if(tab!=='Clube')return;el.innerHTML='<h2>Clube Coolkies</h2><p>Mensal: confirmação automática. Trimestral e semestral: confira cada cobrança na InfinitePay antes de registrar. Cancelamento local não cancela cobranças na InfinitePay.</p>';for(const m of members){const c=m.snapshot.cliente,sec=document.createElement('section');const h=document.createElement('h3');h.textContent=c.name+' · '+({mensal:'Mensal',tri:'Trimestral',sem:'Semestral'}[m.plan])+' · '+money(m.price);sec.append(h);const info=document.createElement('p');info.textContent=[c.email,c.phone,c.street,c.number,c.complement,c.neighborhood,c.cep,'Sabores: '+m.snapshot.sabores.join(', '),m.cancelled?'Cancelado localmente':''].filter(Boolean).join(' · ');sec.append(info);for(const cycle of m.cycles){const line=document.createElement('p');line.textContent=cycle.edition+' | '+(cycle.confirmed?'Pago':cycle.payment_status==='late_paid'?'Revisar pagamento tardio':'Aguardando pagamento')+' | '+(cycle.delivered_at?'Entregue':'Entrega pendente')+' ';if(!cycle.confirmed&&m.plan!=='mensal'&&!m.cancelled){const btn=document.createElement('button');btn.textContent='Confirmar mensalidade';btn.onclick=async()=>{const reference=prompt('Referência única da cobrança confirmada na InfinitePay:');if(!reference)return;try{await clubApi({action:'club-paid',id:m.id,cycle:cycle.cycle,reference});showClub()}catch(e){alert(e.message)}};line.append(btn);}if(cycle.confirmed&&!cycle.delivered_at){const btn=document.createElement('button');btn.textContent='Marcar entregue';btn.onclick=async()=>{try{await clubApi({action:'club-delivered',id:m.id,cycle:cycle.cycle});showClub()}catch(e){alert(e.message)}};line.append(btn);}sec.append(line);}if(!m.cancelled&&['tri','sem'].includes(m.plan)){const btn=document.createElement('button');btn.textContent='Emitir novo código pessoal';btn.onclick=async()=>{if(!confirm('Emitir código e invalidar o anterior? Envie o novo código apenas ao e-mail cadastrado do membro.'))return;try{const r=await clubApi({action:'benefit-issue',id:m.id});const panel=document.createElement('p');const label=document.createElement('label');label.textContent='Código pessoal (exibido somente agora): ';const field=document.createElement('input');field.readOnly=true;field.value=r.code;field.style.width='100%';label.append(field);panel.append(label);const copy=document.createElement('button');copy.textContent='Copiar';copy.onclick=async()=>{try{await navigator.clipboard.writeText(r.code);copy.textContent='Copiado';}catch{field.select();}};panel.append(copy);sec.append(panel);btn.disabled=true;}catch(e){alert(e.message)}};sec.append(btn);}if(!m.cancelled){const btn=document.createElement('button');btn.textContent='Cancelar registro local';btn.onclick=async()=>{if(!confirm('Confirma o cancelamento local? Cancele também o plano na InfinitePay, se aplicável.'))return;try{await clubApi({action:'club-cancel',id:m.id});showClub()}catch(e){alert(e.message)}};sec.append(btn);}el.append(sec);}if(!members.length)el.append('Nenhum cadastro do Clube.');}catch(e){if(tab==='Clube')el.textContent=e.message;}}

async function financeApi(body){const r=await fetch('/.netlify/functions/finance',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+pass},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.message||'Falha no financeiro');return j;}

function financialCalc(c){const map=Object.fromEntries(c.inputs.map(x=>[x.id,x.price/x.qty]));const part=o=>Object.entries(o||{}).reduce((n,[k,v])=>n+(map[k]||0)*v,0);const base=part(c.base)/c.baseYield,caramel=part(c.caramel)/c.caramelPortions;const a=c.assumptions;const recipe=r=>(base*r.base+caramel*(r.caramel||0)+part(r.extra)+part(r.batch)*r.base/c.baseYield)*(1+a.loss/100)+(map.wrapper||0)+a.energyCookie*100+a.laborCookie*100;return {map,base,caramel,recipe,club:sabores=>{const selected=(sabores||[]).map(n=>c.recipes.find(r=>r.name===n));return selected.length===3&&selected.every(Boolean)?selected.reduce((n,r)=>n+recipe(r),0)+recipe(c.recipes[8])+map.box+map.marker+a.freightClub*100:null;}};}

function renderFinance(){const el=$('content'),d=financeData,c=d.config,a=c.assumptions,f=financialCalc(c);let h='<h2>Central financeira</h2><p>Custos atuais e projeções. Taxas, frete e demais valores não medidos são estimativas. Estoque por contagem manual; não há baixa automática de ingredientes. Valores históricos de custo não são congelados.</p><div class="tools">'+['Resumo','Insumos e estoque','Fichas técnicas','Parâmetros','Caixa e compras','Pedidos'].map(v=>'<button data-fview="'+v+'" style="opacity:'+(financeView===v?1:.65)+'">'+v+'</button>').join('')+'</div><p><button id="fSave">Salvar alterações</button> <button id="fRefresh">Recarregar dados</button> <span id="fNotice" role="status"></span></p>';
const net=(price,cost)=>price*(1-(a.fee+a.tax)/100)-cost;
const rows=d.orders.filter(o=>String(o.paidAt).slice(0,7)===financeMonth).map(o=>{let s=o.snapshot,cost=0,missing=[];if(s.tipo==='clube'){cost=f.club(s.sabores);if(cost===null)missing.push('Composição do Clube');}else{for(const i of s.items||[]){if(/^Frete/i.test(i.description)){cost+=a.freightOrder*100;continue;}if(/^Embalagem de presente/i.test(i.description)){cost+=(i.price===1500?a.giftTin:a.giftBox)*100*i.quantity;continue;}const r=c.recipes.find(r=>r.id===i.id&&r.name===i.description)||c.recipes.find(r=>r.name===i.description);if(!r){missing.push(i.description);continue;}cost+=f.recipe(r)*i.quantity;}}return {id:o.id,kind:s.tipo,paid:o.paidAt,revenue:s.total_cents,cost,missing,status:o.status};});
for(const x of d.cycles.filter(x=>String(x.paid_at).slice(0,7)===financeMonth)){const cost=f.club(x.snapshot.sabores);rows.push({id:x.member_id+' / '+x.cycle,kind:'clube '+x.plan,paid:x.paid_at,revenue:x.price,cost,missing:cost===null?['Composição do Clube']:[],status:'paid'});}
const complete=rows.filter(x=>!x.missing.length),revenue=rows.reduce((n,x)=>n+x.revenue,0),costs=complete.reduce((n,x)=>n+x.cost,0),margin=complete.reduce((n,x)=>n+net(x.revenue,x.cost),0),ledger=c.ledger.filter(x=>x.date.slice(0,7)===financeMonth),purchases=ledger.filter(x=>x.kind==='purchase').reduce((n,x)=>n+x.amount,0),expenses=ledger.filter(x=>x.kind==='expense').reduce((n,x)=>n+x.amount,0),other=ledger.filter(x=>x.kind==='income').reduce((n,x)=>n+x.amount,0);
if(['Resumo','Caixa e compras','Pedidos'].includes(financeView))h+='<label>Mês <input type="month" id="fMonth" value="'+esc(financeMonth)+'"></label>';
if(financeView==='Resumo'){h+='<div class="cards">'+card('Receita bruta confirmada',money(revenue))+card('Custos variáveis estimados (pedidos com ficha)',money(costs))+card('Contribuição estimada (pedidos com ficha)',money(margin))+card('Resultado estimado após despesas fixas',money(margin-a.fixed*100))+card('Meta mensal',money(a.target*100))+card('Pedidos sem ficha completa',rows.length-complete.length)+'</div><p>Resultado gerencial parcial: não soma compras de estoque novamente ao custo dos produtos. Despesas fixas são uma previsão; lançamentos reais aparecem na aba Caixa. Receitas recorrentes são consideradas apenas após conciliação. Estornos e devoluções ainda exigem registro manual.</p><h3>Rentabilidade unitária atual</h3>'+fTable(['Produto','Preço','Custo estimado','Contribuição','Margem'],d.products.map(p=>{const r=c.recipes.find(x=>x.id===p.id&&x.name===p.n);if(!r)return [esc(p.n),money(p.p),'Sem ficha','—','—'];const k=f.recipe(r),m=net(p.p,k);return [esc(p.n),money(p.p),money(k),money(m),esc((m/p.p*100).toFixed(1)+'%')];}));const scenarios=[['Econômica',['Caramel Affair','Caramel Affair','Caramel Affair']],['Média',['The OG','Nutella Crush','Caramel Affair']],['Cara',['Kinder Crush','Kinder Crush','Kinder Crush']]];h+='<h3>Clube — cenário Black Forest Christmas</h3>'+fTable(['Plano','Preço','Econômica','Média','Cara'],[['Mensal',6900],['Trimestral',6400],['Semestral',5900]].map(([n,p])=>[n,money(p),...scenarios.map(([_,s])=>money(net(p,f.club(s))))]))+'<p>Capítulos futuros precisam de ficha própria. Frete do Clube incluso conforme parâmetro.</p>';}
if(financeView==='Insumos e estoque'){h+=fTable(['Insumo','Unidade','Qtd. embalagem','Preço (R$)','Custo/un.','Estoque atual','Mínimo'],c.inputs.map((x,i)=>[esc(x.name),esc(x.unit),fInput('inputs.'+i+'.qty',x.qty),fInput('inputs.'+i+'.price',x.price/100),money(x.price/x.qty),fInput('inputs.'+i+'.stock',x.stock),fInput('inputs.'+i+'.min',x.min)+(x.stock!==null&&x.stock<=x.min?' <b>Repor</b>':'')]))+'<p>Estoque em g, ml ou unidades conforme a coluna. Campo vazio = não contado.</p>';}
if(financeView==='Fichas técnicas'){const name=k=>c.inputs.find(x=>x.id===k)?.name||k;const editQuant=(o,path)=>Object.entries(o).map(([k,v])=>'<label style="display:inline-block;margin:5px">'+esc(name(k))+' '+fInput(path+'.'+k,v)+'</label>').join('');h+='<section><h3>Massa-base</h3>'+editQuant(c.base,'base')+'<p>Rendimento em gramas: '+fInput('baseYield',c.baseYield)+' · Custo por 70g '+money(f.base*70)+'</p></section><section><h3>Caramelo salgado</h3>'+editQuant(c.caramel,'caramel')+'<p>Porções: '+fInput('caramelPortions',c.caramelPortions)+' · Custo/porção '+money(f.caramel)+'</p></section>'+c.recipes.map((r,i)=>'<section><h3>'+esc(r.name)+' · '+money(f.recipe(r))+'</h3><label>Massa (g) '+fInput('recipes.'+i+'.base',r.base)+'</label> '+(r.caramel?'Porções caramelo '+fInput('recipes.'+i+'.caramel',r.caramel):'')+'<p>Complementos por cookie: '+editQuant(r.extra,'recipes.'+i+'.extra')+'</p><p>Complementos por receita: '+editQuant(r.batch||{},'recipes.'+i+'.batch')+'</p></section>').join('')+'<p>Rendimento de massa 559g, laranja 180g, marshmallow 20g, bolacha 5g e cereja 12g são estimativas iniciais; confirme pesando. Caramelo: 25 porções declaradas.</p>';}
if(financeView==='Parâmetros'){const labels={fee:'Taxa financeira (%)',tax:'Tributos estimados (%)',loss:'Perdas de ingredientes (%)',energyCookie:'Energia por cookie (R$)',laborCookie:'Mão de obra por cookie (R$)',freightClub:'Frete Clube por caixa (R$)',freightOrder:'Frete avulso por pedido (R$)',giftBox:'Custo caixa presente (R$)',giftTin:'Custo lata presente (R$)',fixed:'Despesas fixas previstas/mês (R$)',target:'Meta de resultado mensal (R$)'};h+=Object.entries(labels).map(([k,n])=>'<p><label>'+n+' '+fInput('assumptions.'+k,a[k])+'</label></p>').join('')+'<p>Taxa 4%, frete Clube R$12 e despesas fixas R$500 são cenários iniciais, não despesas confirmadas. Zeros significam custos ainda não levantados.</p>';}
if(financeView==='Caixa e compras'){h+='<div class="cards">'+card('Vendas brutas confirmadas',money(revenue))+card('Outras entradas',money(other))+card('Compras registradas',money(purchases))+card('Despesas registradas',money(expenses))+card('Saldo de caixa estimado antes das taxas',money(revenue+other-purchases-expenses))+'</div><p>Registre compras e despesas efetivamente pagas; vendas já integradas não devem ser lançadas novamente. Este saldo não é extrato bancário.</p><section><input type="date" id="fDate" value="'+today()+'"> <select id="fKind"><option value="purchase">Compra de insumos</option><option value="expense">Despesa</option><option value="income">Outra entrada</option></select> <input id="fNote" maxlength="300" placeholder="Descrição / fornecedor"> <input type="number" id="fAmount" min="0.01" step="0.01" placeholder="Valor R$"> <button id="fAdd">Adicionar lançamento</button></section>'+fTable(['Data','Tipo','Descrição','Valor',''],ledger.map(x=>[esc(x.date),esc(({purchase:'Compra',expense:'Despesa',income:'Entrada'})[x.kind]),esc(x.note),money(x.amount),'<button data-fdelete="'+esc(x.id)+'">Remover</button>']));}
if(financeView==='Pedidos')h+=fTable(['Referência','Tipo','Recebimento','Receita','Custo estimado','Contribuição'],rows.map(x=>[esc(x.id),esc(x.kind),esc(x.paid),money(x.revenue),x.missing.length?'Sem ficha: '+esc(x.missing.join(', ')):money(x.cost),x.missing.length?'—':money(net(x.revenue,x.cost))]));
el.innerHTML=h;el.oninput=e=>{const t=e.target,path=t.dataset.fin;if(!path)return;const keys=path.split('.');let obj=c;for(const k of keys.slice(0,-1))obj=obj[k];const k=keys.at(-1);let v=t.value===''&&k==='stock'?null:Number(t.value);if(k==='price'&&keys[0]==='inputs')v=Math.round(v*100);obj[k]=v;};el.onchange=e=>{if(e.target.id==='fMonth'){financeMonth=e.target.value;renderFinance();}};el.onclick=async e=>{const t=e.target;if(t.dataset.fview){financeView=t.dataset.fview;renderFinance();return;}if(t.id==='fRefresh'){if(confirm('Descartar alterações não salvas e recarregar?'))showFinance(true);return;}if(t.id==='fSave'){t.disabled=true;try{const r=await financeApi({action:'save',config:c,version:d.version});d.version=r.version;renderFinance();$('fNotice').textContent='Salvo com sucesso.';}catch(e){$('fNotice').textContent=e.message;t.disabled=false;}return;}if(t.id==='fAdd'){const amount=Math.round(Number($('fAmount').value)*100),note=$('fNote').value.trim(),date=$('fDate').value;if(!date||!note||!(amount>0)){alert('Preencha data, descrição e valor.');return;}c.ledger.push({id:crypto.randomUUID(),date,kind:$('fKind').value,note,amount});financeMonth=date.slice(0,7);renderFinance();$('fNotice').textContent='Lançamento adicionado. Clique em Salvar alterações.';}if(t.dataset.fdelete&&confirm('Remover lançamento?')){c.ledger=c.ledger.filter(x=>x.id!==t.dataset.fdelete);renderFinance();$('fNotice').textContent='Clique em Salvar alterações.';}};}
</script></html>
