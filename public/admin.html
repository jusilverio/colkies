<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coolkies | Administração</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8f5;color:#422d32;font:15px system-ui}header{background:#f4d4dd;padding:24px 5%;display:flex;justify-content:space-between;align-items:center}h1,h2{font-family:Georgia}main{max-width:1200px;margin:auto;padding:24px}button,input,select{font:inherit;padding:10px;border:1px solid #d8b9bf;border-radius:9px;background:white;color:inherit}button{cursor:pointer;background:#743e50;color:white}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card,section{background:white;border:1px solid #efdde0;border-radius:15px;padding:18px;margin-bottom:14px}.big{font-size:26px;font-weight:bold}small{color:#795e65}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:12px;border-bottom:1px solid #eee} .scroll{overflow:auto} .tag{background:#f6e6e9;padding:5px 8px;border-radius:9px} .tools{display:flex;gap:8px;flex-wrap:wrap}#detail{white-space:pre-wrap} [hidden]{display:none!important}</style><header><div><h1 style="margin:0">Coolkies.</h1><small>Ateliê de gestão · área exclusiva</small></div><div><a href="/seguranca.html" style="margin-right:12px;color:#743e50;font-weight:bold">Segurança</a><a href="/simulacao.html" style="margin-right:12px;color:#743e50;font-weight:bold">Modo de teste</a><button id="logout">Sair</button></div></header><main><section id="login"><h2>Acesso administrativo</h2><p>Entre com a senha administrativa configurada no servidor.</p><input id="password" type="password" placeholder="Senha" autocomplete="current-password"> <button id="enter">Entrar</button> <button id="demo">Explorar demonstração</button></section><p id="notice" role="status"></p><div id="app" hidden><nav id="nav"></nav><div class="tools"><input id="search" placeholder="Buscar cliente ou pedido"><select id="period"><option value="all">Todo período</option><option value="today">Hoje</option><option value="week">Últimos 7 dias</option><option value="month">Este mês</option></select><button id="reload">Atualizar</button></div><div id="content"></div><section id="detail" hidden></section></div></main><script>
const $=id=>document.getElementById(id), money=n=>(Number(n||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let orders=[],pass='',demo=false,tab='Visão geral';const tabs=['Visão geral','Pedidos','Produção','Entregas','Clube','Financeiro','Frete','Produtos','Agenda','Tarifas','Clientes'];const states=['recebido','em produção','pronto','em entrega','entregue','cancelado'];const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'});const day=x=>new Date(x).toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'});const paid=o=>o.status==='pago';const items=o=>(o.items||[]).filter(i=>!/^Frete|^Caixa|^Lata|^Embalagem de presente/i.test(i.description));const sum=a=>a.reduce((s,o)=>s+Number(o.total_cents||0),0);const date=o=>o.agendamento?.date||'';const stage=o=>o.operacional||'recebido';const active=o=>paid(o)&&!['entregue','cancelado'].includes(stage(o));function sample(){return [{order_nsu:'DEMO-001',status:'pago',criado_em:new Date().toISOString(),pago_em:new Date().toISOString(),total_cents:5400,tipo:'avulso',cliente:{name:'Cliente exemplo',street:'Rua Exemplo',number:'100',city:'São Paulo'},agendamento:{date:today(),time:'18:00'},items:[{description:'The OG',quantity:2,price:1400},{description:'Dark Side',quantity:1,price:1600},{description:'Frete',quantity:1,price:1000}]},{order_nsu:'DEMO-002',status:'aguardando',criado_em:new Date().toISOString(),total_cents:2300,tipo:'clube',cliente:{name:'Assinante exemplo'},agendamento:{date:today(),time:'19:00'},items:[{description:'Black Forest Christmas',quantity:1,price:2300}]}]}
async function api(body){let r=await fetch('/.netlify/functions/admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+pass},body:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw Error(j.message||'Falha no acesso');return j}async function load(){try{orders=demo?orders:(await api({action:'list'})).orders;if(!demo){await api({action:'install'});} $('login').hidden=true;$('app').hidden=false;$('notice').textContent=demo?'DEMONSTRAÇÃO — dados fictícios; nenhuma alteração real.':'Área administrativa · MySQL conectado e base inicializada';render()}catch(e){$('notice').textContent=e.message}}function filtered(){let q=$('search').value.toLowerCase(),p=$('period').value,t=today(),week=day(Date.now()-6*86400000);return orders.filter(o=>JSON.stringify([o.order_nsu,o.cliente?.name]).toLowerCase().includes(q)&&(p==='all'||(p==='today'&&day(o.pago_em||o.criado_em)===t)||(p==='week'&&day(o.pago_em||o.criado_em)>=week)||(p==='month'&&day(o.pago_em||o.criado_em).slice(0,7)===t.slice(0,7))))}function card(a,b){return `<div class="card"><small>${a}</small><div class="big">${b}</div></div>`}function table(a){return `<div class="scroll"><table><thead><tr><th>Pedido / cliente</th><th>Entrega</th><th>Pagamento</th><th>Total</th><th>Operação</th></tr></thead><tbody>${a.map(o=>`<tr><td><button data-id="${esc(o.order_nsu)}">${esc(o.cliente?.name||o.order_nsu)}</button></td><td>${esc(date(o))} ${esc(o.agendamento?.time)}</td><td>${esc(o.status)}</td><td>${money(o.total_cents)}</td><td>${esc(stage(o))}</td></tr>`).join('')||'<tr><td colspan="5">Nenhum pedido neste filtro.</td></tr>'}</tbody></table></div>`}let faixasDemo=[];async function editarFrete(){const el=$('content');el.innerHTML='<h2>Frete por CEP</h2><p>Cadastre apenas faixas verificadas. Faixas manuais substituem a base estimada de CEPs. Outros CEPs sem estimativa ficam sob consulta. Uma linha por faixa: CEP inicial; CEP final; região; valor em reais (ex.: 8,00).</p><textarea id="faixas" rows="12" style="width:100%;padding:12px" placeholder="CEP inicial; CEP final; região; 8,00"></textarea><p><button id="salvarFrete">Salvar tabela</button></p><p id="freteMsg"></p>';try{let rows=demo?faixasDemo:(await api({action:'frete-list'})).faixas;if(tab!=='Frete')return;$('faixas').value=rows.map(r=>[r.inicio,r.fim,r.nome,(r.centavos/100).toFixed(2).replace('.',',')].join('; ')).join('\n');$('salvarFrete').onclick=async()=>{try{let rows=$('faixas').value.split('\n').filter(x=>x.trim()).map(x=>{let a=x.split(';').map(y=>y.trim());if(a.length!==4||!/^\d+(?:[,.]\d{1,2})?$/.test(a[3]))throw Error('Confira o formato de cada linha.');return {inicio:a[0].replace(/-/g,''),fim:a[1].replace(/-/g,''),nome:a[2],centavos:Math.round(Number(a[3].replace(',','.'))*100)}});if(demo){faixasDemo=rows;$('freteMsg').textContent='Demonstração: tabela mantida apenas nesta sessão.';}else{await api({action:'frete-save',faixas:rows});$('freteMsg').textContent='Tabela salva.';}}catch(e){$('freteMsg').textContent=e.message}}}catch(e){if(["Produtos","Agenda","Tarifas","Clientes"].includes(tab)){manage();return;}if(tab==='Frete')$('freteMsg').textContent=e.message}}function render(){let a=filtered(),p=a.filter(paid),t=today(),week=day(Date.now()-6*86400000),all=orders.filter(paid);$('nav').innerHTML=tabs.map(x=>`<button data-tab="${x}" style="opacity:${x===tab?1:.65}">${x}</button>`).join('');if(["Produtos","Agenda","Tarifas","Clientes"].includes(tab)){manage();return;}if(tab==='Frete'){$('detail').hidden=true;editarFrete();return;}let h=`<h2>${tab}</h2>`;if(tab==='Visão geral')h+=`<div class="cards">${card('Receita confirmada',money(sum(p)))}${card('Pedidos pagos',p.length)}${card('Aguardando pagamento',a.filter(o=>!paid(o)).length)}${card('Entregas pendentes',a.filter(active).length)}</div><section><h2>Pedidos recentes</h2>${table(a)}</section>`;if(tab==='Pedidos')h+=table(a);if(tab==='Entregas')h+=table(a.filter(active).sort((x,y)=>(date(x)+x.agendamento?.time).localeCompare(date(y)+y.agendamento?.time)));if(tab==='Clube')h+='<p>Pedidos identificados como clube. Não representa confirmação de assinatura recorrente.</p>'+table(a.filter(o=>o.tipo==='clube'));if(tab==='Produção'){let m={};let dt=productionDate||today();h+=`<label>Data de entrega <input type=date id=prodDate value="${esc(dt)}"></label>`;orders.filter(o=>active(o)&&date(o)===dt).forEach(o=>items(o).forEach(i=>m[i.description]=(m[i.description]||0)+i.quantity));h+='<p>Quantidades de pedidos pagos ainda não concluídos (conforme filtro).</p><div class="cards">'+Object.entries(m).map(([k,v])=>card(esc(k),v)).join('')+'</div>'}if(tab==='Financeiro')h+=`<div class="cards">${card('Hoje',money(sum(all.filter(o=>day(o.pago_em||o.criado_em)===t))))}${card('Últimos 7 dias',money(sum(all.filter(o=>day(o.pago_em||o.criado_em)>=week))))}${card('Este mês',money(sum(all.filter(o=>day(o.pago_em||o.criado_em).slice(0,7)===t.slice(0,7)))))}</div><p>Receita bruta confirmada, incluindo frete e embalagem; não representa lucro líquido.</p>${table(p)}`;$('content').innerHTML=h;$('detail').hidden=true;if($('prodDate'))$('prodDate').onchange=e=>{productionDate=e.target.value;render()};}function detail(id){let o=orders.find(x=>x.order_nsu===id);if(!o)return;let c=o.cliente||{};$('detail').hidden=false;$('detail').innerHTML=`<h2>Detalhes do pedido</h2>${esc(id)}
${esc(c.name)} · ${esc(c.phone)} · ${esc(c.email)}
${esc([c.street,c.number,c.complement,c.neighborhood,c.city,c.state,c.cep].filter(Boolean).join(', '))}
Entrega: ${esc(date(o))} ${esc(o.agendamento?.time)}
${(o.items||[]).map(i=>esc(i.quantity+' × '+i.description)).join('\n')}
${o.presente?esc('Presente para '+o.presente.para+' · de '+o.presente.de+' · '+o.presente.mensagem):''}
Total: ${money(o.total_cents)}
<select id="stage">${states.map(s=>`<option ${s===stage(o)?'selected':''}>${s}</option>`).join('')}</select> <button id="save">Salvar status</button>`;$('save').onclick=async()=>{try{if(!demo)await api({action:'update',id,status:$('stage').value});o.operacional=$('stage').value;await load()}catch(e){$('notice').textContent=e.message}}}document.addEventListener('click',e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;render()}if(e.target.dataset.id)detail(e.target.dataset.id)});$('enter').onclick=()=>{demo=false;pass=$('password').value;$('password').value='';load()};$('demo').onclick=()=>{demo=true;orders=sample();load()};$('reload').onclick=load;$('search').oninput=render;$('period').onchange=render;$('logout').onclick=()=>location.reload();
let productionDate='',config=null;
async function manage(){const current=tab;$('detail').hidden=true;try{if(!config){if(demo){config={capacity:5,daily:60,blocked:[],rates:Array.from({length:15},(_,i)=>800+i*200),products:[]};}else config=(await api({action:'settings'})).settings;}if(tab!==current)return;let h='<h2>'+esc(tab)+'</h2>';if(tab==='Clientes'){let m=new Map();for(const o of orders.filter(paid)){let c=o.cliente||{},k=(c.email||c.phone||o.order_nsu).toLowerCase();let a=m.get(k)||{c,orders:[]};a.orders.push(o);m.set(k,a);}h+=[...m.values()].map(a=>`<section><b>${esc(a.c.name)}</b> · ${esc(a.c.email)} · ${esc(a.c.phone)}<p>${a.orders.length} compras · ${money(sum(a.orders))}</p>${table(a.orders)}</section>`).join('')||'<p>Nenhum cliente com pedido pago.</p>'; $('content').innerHTML=h;return;}
if(tab==='Produtos'){h+='<button id="addProduct">Novo produto</button>'+config.products.map((p,i)=>`<section data-product="${i}"><label>Nome <input data-field="n" value="${esc(p.n)}"></label> <label>Preço R$ <input type="number" step="0.01" data-field="p" value="${p.p/100}"></label> <label>Ativo <input type="checkbox" data-field="active" ${p.active?'checked':''}></label><p><label>Descrição <input data-field="d" value="${esc(p.d)}"></label> <label>Categoria <input data-field="tag" value="${esc(p.tag)}"></label></p><label>Foto (até 220 KB) <input type="file" accept="image/png,image/jpeg,image/webp" data-photo="${i}"></label>${p.img?`<img width="80" src="${esc(p.img)}"> <button data-remove="${i}">Remover foto</button>`:''}</section>`).join('');}
if(tab==='Agenda')h+=`<label>Pedidos por horário <input id="cap" type="number" value="${config.capacity}"></label> <label>Cookies por dia <input id="daily" type="number" value="${config.daily}"></label><p><input id="block" type="date"> <button id="addBlock">Bloquear data</button></p>`+config.blocked.map(d=>`<p>${esc(d)} <button data-unblock="${esc(d)}">Desbloquear</button></p>`).join('');
if(tab==='Tarifas')h+=config.rates.map((v,i)=>`<p><label>Até ${i+1} km estimados — R$ <input type="number" step="0.01" data-rate="${i}" value="${v/100}"></label></p>`).join('');
$('content').innerHTML=h+'<button id="saveConfig">Salvar configurações</button>';const root=$('content');root.oninput=e=>{let t=e.target,f=t.dataset.field;if(f){let p=config.products[Number(t.closest('[data-product]').dataset.product)];p[f]=f==='p'?Math.round(Number(t.value)*100):f==='active'?t.checked:t.value;}if(t.dataset.rate!==undefined)config.rates[Number(t.dataset.rate)]=Math.round(Number(t.value)*100);if(t.id==='cap')config.capacity=Number(t.value);if(t.id==='daily')config.daily=Number(t.value);};root.onchange=e=>{let t=e.target;if(t.dataset.photo===undefined||!t.files[0])return;let f=t.files[0];if(f.size>220000||!['image/png','image/jpeg','image/webp'].includes(f.type)){alert('Foto inválida ou maior que 220 KB');return;}let r=new FileReader();r.onload=()=>{config.products[Number(t.dataset.photo)].img=r.result;manage()};r.readAsDataURL(f);};root.onclick=e=>{let t=e.target;if(t.id==='addProduct'){config.products.push({id:config.products.length,n:'Novo sabor',p:1400,d:'',tag:'Clássicos',active:false,img:''});manage();}if(t.dataset.remove!==undefined){config.products[Number(t.dataset.remove)].img='';manage();}if(t.id==='addBlock'&&$('block').value){config.blocked=[...new Set([...config.blocked,$('block').value])];manage();}if(t.dataset.unblock) {config.blocked=config.blocked.filter(d=>d!==t.dataset.unblock);manage();}};$('saveConfig').onclick=async()=>{try{if(!demo)config=(await api({action:'settings-save',settings:config})).settings;$('notice').textContent=demo?'Prévia: alterações somente nesta sessão.':'Configurações salvas.';}catch(e){$('notice').textContent=e.message;}};
}catch(e){$('notice').textContent=e.message;}}
</script></html>
