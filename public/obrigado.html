<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Pedido confirmado | Coolkies</title><style>*{box-sizing:border-box}body{margin:0;background:#fff7f3;color:#422d32;font:16px system-ui,sans-serif}main{max-width:580px;margin:auto;padding:24px 18px 48px}header{text-align:center;padding:14px 0 22px}header a{font:bold 34px Georgia;color:#743e50;text-decoration:none}h1,h2{font-family:Georgia;color:#743e50}h1{font-size:28px;margin:0 0 10px}h2{font-size:20px;margin:0 0 16px}p{line-height:1.55}section{border:1px solid #efdde0;background:#fff;border-radius:18px;padding:22px;margin:14px 0}.center{text-align:center}.btn,button{display:inline-block;background:#743e50;color:white;text-decoration:none;border:0;border-radius:30px;padding:13px 20px;font:600 15px system-ui;cursor:pointer}.secondary{background:#f7e5ea;color:#743e50}small,.muted{color:#795e65}ol{padding:0;list-style:none}li{position:relative;padding:3px 0 22px 36px}li::before{content:'○';position:absolute;left:0;top:0;color:#c9a3b0;font-size:25px;line-height:1}li.done::before{content:'✓';background:#743e50;color:white;border-radius:50%;font-size:15px;width:24px;height:24px;display:grid;place-items:center}li.current::before{content:'●';color:#743e50}li:not(:last-child)::after{content:'';position:absolute;left:11px;top:25px;height:calc(100% - 26px);border-left:1px solid #e6cdd6}li span{display:block;color:#795e65;font-size:14px;margin-top:4px}.line{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid #f1e3e7}.line:last-child{border:0}.total{font-weight:bold;padding-top:12px}.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}input{width:100%;padding:10px;border:1px solid #e1c7d0;border-radius:8px;font:inherit}footer{text-align:center;color:#795e65;font-size:13px;margin-top:24px}[hidden]{display:none!important}</style></head><body><main><header><a href="/">Coolkies.</a></header><section class="center"><h1 id="titulo">Confirmando seu pagamento…</h1><p id="texto" role="status">Só um instante.</p><div class="actions"><a id="track" class="btn" hidden>Acompanhar meu pedido</a><button id="retry" class="secondary" hidden>Tentar novamente</button><a class="btn secondary" href="/">Voltar à loja</a></div><p id="hint" class="muted" hidden>Salve o link exclusivo de acompanhamento para consultar depois.</p></section><footer>Feito com carinho. Assado para você. ♡</footer></main><script>
const $=id=>document.getElementById(id), q=new URLSearchParams(location.search);let attempts=0,busy=false,paid=false;
async function check(){if(busy)return;busy=true;$('retry').hidden=true;attempts++;try{
 const r=await fetch('/.netlify/functions/status-pagamento?'+q.toString(),{cache:'no-store',referrerPolicy:'no-referrer'}),j=await r.json();
 if(j.revisao){$('titulo').textContent='Pagamento em revisão';$('texto').textContent='Seu pagamento chegou após o prazo de reserva. Entre em contato com a Coolkies. Não pague novamente.';return;}
 if(j.pago){paid=true;$('titulo').textContent='Pedido confirmado! 🍪';$('texto').textContent='Recebemos seu pagamento e registramos seu pedido.';
 if(typeof j.tracking_token==='string'&&/^[A-Za-z0-9_-]{43}$/.test(j.tracking_token)){const href='/acompanhar.html#'+j.tracking_token;$('track').href=href;$('track').hidden=false;$('hint').hidden=false;location.replace(href);return;}}
 }catch{}finally{busy=false;}
 if(attempts<6){setTimeout(check,3000);return;}
 $('titulo').textContent=paid?'Pedido confirmado! 🍪':'Ainda estamos confirmando';
 $('texto').textContent=paid?'Seu pagamento foi confirmado. Não conseguimos gerar o link agora; tente novamente.':'Se você já pagou, não pague novamente. Tente consultar a confirmação de novo.';
 $('retry').hidden=false;
}
$('retry').onclick=()=>{attempts=0;check();};check();
</script></body></html>
